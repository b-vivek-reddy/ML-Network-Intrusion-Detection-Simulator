<!DOCTYPE html>
<html>
<head>
    <title>Intrusion Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: 'Segoe UI';
            text-align: center;
        }

        h1 { color: #38bdf8; }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            width: 60%;
            margin: auto;
            box-shadow: 0 0 20px rgba(56,189,248,0.3);
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
        }

        .start-btn { background: #22c55e; }
        .stop-btn { background: #ef4444; }

        #status {
            font-size: 22px;
            margin: 15px;
            padding: 10px;
            border-radius: 10px;
        }

        .normal { background: #065f46; }

        .alert {
            background: #7f1d1d;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.5; }
        }

        .metrics {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }

        .box {
            background: #020617;
            padding: 15px;
            border-radius: 10px;
            width: 30%;
        }
    </style>
</head>

<body>

<h1>🚨 Intrusion Detection System</h1>

<div class="card">

    <button class="start-btn" onclick="startSystem()">▶ Start</button>
    <button class="stop-btn" onclick="stopSystem()">⏹ Stop</button>

    <div id="status">Stopped</div>

    <div class="metrics">
        <div class="box">📦 Packet: <span id="packet">--</span></div>
        <div class="box">📶 RSSI: <span id="rssi">--</span></div>
        <div class="box">📊 Accuracy: <span id="accuracy">--</span></div>
    </div>

    <canvas id="chart"></canvas>

</div>

<script src="script.js"></script>

</body>
</html>
